<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>webar-frame-viewer — exemplo vanilla</title>
    <script src="../../packages/webar-frame-viewer/dist/frame-viewer.umd.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin-inline: auto;
      }
      img {
        width: 100%;
        border-radius: 8px;
        background: #eee;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 16px;
        font-size: 17px;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        background: #16a34a;
        color: #fff;
      }
      button:disabled {
        background: #999;
      }
      #aviso {
        margin-top: 12px;
        font-size: 13px;
        color: #666;
        line-height: 1.4;
      }
      label {
        display: block;
        margin-top: 16px;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Quadro Abstrato 50 × 70 cm</h1>
    <img id="preview" alt="Prévia da arte" />

    <div id="root"></div>
    <button id="abrir" type="button" disabled>Ver na sua Parede</button>
    <p id="aviso">Verificando compatibilidade…</p>

    <label>
      Testar com a sua própria arte:
      <input id="arquivo" type="file" accept="image/*" />
    </label>

    <script>
      // Arte de demonstração gerada no próprio navegador — o exemplo funciona
      // offline e sem depender de CORS de nenhum CDN.
      function arteDemo() {
        const c = document.createElement('canvas');
        c.width = 800;
        c.height = 1000;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 800, 1000);
        g.addColorStop(0, '#0f172a');
        g.addColorStop(0.5, '#7c3aed');
        g.addColorStop(1, '#f59e0b');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 800, 1000);
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 40; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 800, Math.random() * 1000, Math.random() * 90 + 10, 0, 7);
          ctx.fill();
        }
        return c.toDataURL('image/jpeg', 0.9);
      }

      const produto = {
        id: 'prod-001',
        title: 'Quadro Abstrato 50 × 70',
        imageUrl: arteDemo(),
        widthCm: 50,
        heightCm: 70,
        depthCm: 3,
      };

      document.getElementById('preview').src = produto.imageUrl;

      document.getElementById('arquivo').addEventListener('change', (ev) => {
        const file = ev.target.files?.[0];
        if (!file) return;
        produto.imageUrl = URL.createObjectURL(file);
        document.getElementById('preview').src = produto.imageUrl;
      });

      // Esconder o botão quando não dá para oferecer a experiência é melhor do
      // que abrir um overlay que só mostra erro.
      window.FrameViewer.isSupported().then((caps) => {
        const botao = document.getElementById('abrir');
        const aviso = document.getElementById('aviso');
        if (caps.recommended) {
          botao.disabled = false;
          aviso.textContent =
            caps.recommended === 'webxr'
              ? 'WebXR disponível: escala física real e rastreamento na parede.'
              : 'Modo câmera: arraste para posicionar e pince para ajustar a distância.';
        } else if (!caps.secureContext) {
          aviso.textContent =
            'A câmera exige HTTPS. Rode `npm run tunnel:xampp` e abra o endereço https:// no celular.';
        } else {
          aviso.textContent = 'Seu dispositivo não é compatível com Realidade Aumentada.';
        }
      });

      document.getElementById('abrir').addEventListener('click', () => {
        const viewer = window.FrameViewer.create({
          container: document.getElementById('root'),
          product: produto,
          options: {
            onPlace: (info) => console.log('Quadro posicionado em:', info.position),
            onClose: () => console.log('AR fechado'),
            onError: (err) => console.error(err.code, err.userMessage),
          },
        });
        viewer.start();
      });
    </script>
  </body>
</html>
